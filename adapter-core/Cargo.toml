[package]
name = "adapter-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib"]

[features]
wasm = ["dep:wasm-bindgen"]
pyo3 = ["dep:pyo3"]

[dependencies]
engine = { version = "0.1.0", path = "../engine" }
pyo3 = { version = "0.29.2", optional = true }
strum = "0.28.0"
wasm-bindgen = { version = "0.2.129", optional = true }
