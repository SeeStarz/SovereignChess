[project]
name = "adapter-py"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
]

[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src/python"
module-name = "adapter_py.rust_bridge"

[tool.uv.workspace]
members = [
    "src/python/adapter_py/frontend-pyqt",
]
